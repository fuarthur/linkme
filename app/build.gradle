plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.ams.linkme'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ams.linkme'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'USE_EMULATORS', 'false'
    }
    buildTypes {
        debug {
            buildConfigField 'boolean', 'USE_EMULATORS', providers.gradleProperty('useEmulators').getOrElse('false')
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.4.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation('androidx.test.espresso:espresso-contrib:3.6.1') {
        // The old protobuf-lite duplicates Firestore's protobuf-javalite classes in the test APK.
        exclude group: 'com.google.protobuf', module: 'protobuf-lite'
    }
    androidTestImplementation 'androidx.test:rules:1.6.1'
}

// Select the demo config after the plugin has registered its variant task.
// This runs before FirebaseInitProvider, with no default-app deletion.
afterEvaluate {
    if (providers.gradleProperty('useEmulators').getOrElse('false') == 'true') {
        tasks.named('processDebugGoogleServices').configure {
            googleServicesJsonFiles.set([file('src/emulator/google-services.json')])
        }
    }
}
